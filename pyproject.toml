[project]
name = "agentiai-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DeepakJMudali", email = "deepak.mudali80@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.6",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.16",
    "langsmith>=0.14.11",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
    "transformers>=5.20.1",
]

[project.scripts]
agentiai-project = "agentiai_project:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
